name: Deploy website to GitHub Pages

env:
  # Keep in step with the Hugo used locally (make-all.ps1 -Build). 0.157.0 is
  # the version the 2026-10-04 site audit was verified with.
  HUGO_VERSION: '0.157.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  # Pull requests are built and checked but never deployed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Python (site checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install check dependencies
        run: python -m pip install pyyaml ruamel.yaml

      - name: Test site tooling (importer, author aliases, checker)
        run: python -m unittest discover -s _pythonscripts -p "test_*.py" -v

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-
            ${{ runner.os }}-hugo-

      - name: Clean Hugo module state
        run: |
          hugo mod clean || true

      - name: Show build environment
        run: |
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          hugo version
          hugo env
          hugo mod graph || true

      # baseURL comes from config/_default/hugo.yaml (https://www.sajid.bd/),
      # the custom domain GitHub Pages serves, so local and CI builds emit the
      # same canonical, hreflang, sitemap and feed URLs. (It used to be
      # overridden here with the Pages base_url.)
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          set -o pipefail
          hugo --gc --minify --printPathWarnings --printI18nWarnings 2>&1 | tee hugo-build.log

      # Phase 8 item 8.20. `header.search: true` (config/_default/params.yaml)
      # ships the search modal and hb-search.js on every page, and that script
      # dynamically imports /pagefind/pagefind.js. Nothing ever generated that
      # bundle, so every page loaded the search UI and then logged
      #   Failed to initialize Pagefind: TypeError: Failed to fetch dynamically
      #   imported module: …/pagefind/pagefind.js
      # — a 404 on every route, a permanently broken search box, and the only
      # console error standing between the site and Lighthouse Best Practices 100.
      # Pagefind is a self-contained binary, so it is pinned via npx rather than
      # added to package.json; nothing else in the toolchain changes.
      - name: Build the Pagefind search index
        run: |
          npx --yes pagefind@1.4.0 --site public
          test -f public/pagefind/pagefind.js

      # Fails the build (and so the deploy) on duplicate target paths, broken
      # internal links/assets, missing titles/descriptions/canonicals, h1 and
      # id problems, missing alt text, unnamed links and content regressions.
      # External links are not checked: publishers and DOI resolvers often
      # answer CI with 403 or time out. See _pythonscripts/check_site.py.
      - name: Check site integrity
        run: python _pythonscripts/check_site.py --public public --build-log hugo-build.log

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.repository_owner != 'HugoBlox' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
