# Canonical author identities for publication pages.
#
#   <canonical>: [<spelling as printed in cv/papers.bib>, ...]
#
# _pythonscripts/import_publications.py rewrites every listed spelling to its
# canonical value when it generates content/{en,bn}/publication/*/index.md, so
# one person gets one /authors/<slug>/ page. cv/papers.bib itself is left as
# published (the CV prints the names as they appear on each paper).
#
# Canonical value:
#   * a lab member with a profile: the profile slug, i.e. the file name of
#     data/authors/<slug>.yaml. The page shows that profile's name and links
#     to it. _pythonscripts/sync_authors.py turns the spellings listed here into
#     `aliases` on the profile, so the old /authors/<spelling>/ URLs redirect.
#   * anyone else: the fullest form of the name found in the publication
#     record, initials followed by a full stop.
#
# The site owner is handled separately: OWNER_NAMES in import_publications.py
# maps every spelling of Sajid Muhaimin Choudhury to `me`.
#
# _pythonscripts/check_site.py fails when a publication lists a spelling that
# appears here, or the name of a profile that is not mapped here.
#
# Only add a mapping when the record shows it is the same person (same lab,
# co-authors, ORCID or Crossref record). Do not map on name alone.

