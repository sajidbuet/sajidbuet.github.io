# Navigation Links
#
# Phase 4: items now point at real pages instead of homepage anchors, and
# `Funding` is gone as a primary item — funding lives under Research at
# /research/funding/ since the grant migration.
#
# `Projects` now points at the genuine software/engineering portfolio. That is
# only safe because the grants moved out of /projects/ first and every old
# /projects/g-* URL is preserved by an alias.
#
# Phase 5: `Outreach` is now `Resources` at /resources/. Every old
# /outreach/** URL is preserved by a Hugo alias — see
# docs/redesign/phase-5-url-migration.md.
#
# STILL DEFERRED: removing the textual `Home` item. The logo is an accessible
# Home link (navbar.html carries `aria-label="<site> - Home"`), but this menu
# is rendered by a single `range site.Menus.main` that feeds both the desktop
# bar and the mobile drawer, so dropping Home here would remove it from the
# mobile menu too — which IA §4.1 requires to keep it. Site-wide breadcrumbs,
# the other stated precondition, are also still not enabled.
#
# News is deliberately absent from this menu (it already was after Phase 4).
# It stays reachable from the homepage feed, the footer "News Archive" link
# and /news/index.xml.

main:
  - name: Home
    url: '/'
    weight: 10
  - name: Research
    url: '/research/'
    weight: 20
  - name: Publications
    url: '/publication/'
    weight: 30
  - name: Projects
    url: '/projects/'
    weight: 40
  - name: Teaching
    url: '/teaching/'
    weight: 50
  - name: Team
    url: '/authors/'
    weight: 60
  - name: Resources
    url: '/resources/'
    weight: 70
  - name: Contact
    url: '/#contact'
    weight: 80
