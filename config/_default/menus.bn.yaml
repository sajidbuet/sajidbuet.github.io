# Bengali navigation. Same structure as menus.yaml (the English menu).
#
# URLs are site paths. The navbar (layouts/_partials/components/headers/
# navbar.html, via functions/lang_url) links to the Bengali page when one
# exists (/bn/research/, /bn/publication/, /bn/authors/) and otherwise to the
# English page (/projects/, /teaching/, /resources/), so no item points at a
# /bn/ page that does not exist. The pre-redesign one-page anchors
# (/bn/#about, /bn/#teaching, ...) are gone with that homepage layout.

main:
  - name: হোম
    url: '/'
    weight: 10
  - name: গবেষণা
    url: '/research/'
    weight: 20
  - name: প্রকাশনা
    url: '/publication/'
    weight: 30
  - name: প্রকল্প
    url: '/projects/'
    weight: 40
  - name: পাঠদান
    url: '/teaching/'
    weight: 50
  - name: দল
    url: '/authors/'
    weight: 60
  - name: রিসোর্স
    url: '/resources/'
    weight: 70
  - name: যোগাযোগ
    url: '/#contact'
    weight: 80
