# Languages — the single source of language configuration for this site.
#   Documentation: https://docs.hugoblox.com/reference/language/
#
# Each language has its own content root. The two roots must not be nested:
# when English used `content` and Bengali `content/bn`, every Bengali file was
# also rendered as an English page at the same /bn/... path ("Duplicate target
# paths", site audit 2026-10-04, C2).
#
# English is the default language and is served from the site root
# (defaultContentLanguageInSubdir: false in hugo.yaml), so content/en/foo/
# publishes at /foo/. Bengali publishes under /bn/.

en:
  languageCode: en-us
  languageName: English
  weight: 1
  contentDir: content/en

bn:
  languageCode: bn-BD
  languageName: বাংলা
  weight: 2
  contentDir: content/bn
  title: সাজিদ ল্যাব
