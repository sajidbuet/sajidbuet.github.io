# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: 'SAJID Lab'
# Website URL
# Phase 2A: corrected from 'https://www.sajid.org.bd/', which does not resolve
# (NXDOMAIN). Production was unaffected only because
# .github/workflows/publish.yaml overrides --baseURL with the GitHub Pages
# base_url; any build without that override emitted canonical, hreflang,
# sitemap, RSS and Open Graph URLs pointing at a dead host.
baseURL: 'https://www.sajid.bd/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true
languages:
  en:
    languageCode: en-us
    languageName: English
    weight: 1
    contentDir: content

  bn:
    languageCode: bn-BD
    languageName: বাংলা
    weight: 2
    contentDir: content/bn
############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: ["\\.ipynb$", ".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
# Phase 4: enabled so Hugo emits front-matter `aliases:` as redirect stubs.
# This site deploys to GitHub Pages, which ignores Netlify's `_redirects`
# file, so alias stubs are the only working redirect mechanism here. They are
# required to preserve the old /projects/g-* grant URLs after Funding moved to
# /research/funding/. Verified against generated output — see
# docs/redesign/phase-4-url-migration.md.
disableAliases: false
#permalinks:
#  authors: '/people/:slug/'
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
  # Phase 4: project portfolio. Category is a taxonomy rather than a
  # directory so re-categorising a project never changes its URL.
  project_category: project_categories
  technology: technologies
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
sitemap:
  _merge: deep
